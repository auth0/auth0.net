name: Publish release to NuGet

inputs:
  dotnet-version:
    required: true
  nuget-user:
    required: true
  version:
    required: true
  project-paths:
    required: true
  nuget-directory:
    required: true

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    
    - name: Create NuGet packages
      shell: pwsh
      env:
        PROJECT_PATHS: ${{ inputs.project-paths }}
        NUGET_DIRECTORY: ${{ inputs.nuget-directory }}
      run: |
        foreach($file in (ConvertFrom-Json -InputObject "$env:PROJECT_PATHS")) {
            dotnet pack $file --configuration Release --output $env:NUGET_DIRECTORY
        }

    # Exchange the GitHub OIDC token for a short-lived (1 hour) NuGet API key via Trusted Publishing
    - name: NuGet login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.nuget-user }}

    - name: Publish NuGet packages
      shell: pwsh
      env:
        NUGET_DIRECTORY: ${{ inputs.nuget-directory }}
        NUGET_TOKEN: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        foreach($file in (Get-ChildItem "$env:NUGET_DIRECTORY" -Recurse -Include *.nupkg)) {
            dotnet nuget push $file --api-key "$env:NUGET_TOKEN" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
